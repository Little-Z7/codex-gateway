x-ssh-target: &ssh-target
  environment:
    CODEX_HOME: /home/codex/.codex
    # Only set when the caller enables the custom model provider; never committed.
    CODEX_GATEWAY_MODEL_PROVIDER_API_KEY: ${E2E_MODEL_PROVIDER_API_KEY:-}
  volumes:
    - ../..:/workspace/codex-gateway

services:
  bark-target:
    image: node:22-bookworm
    command: ["node", "/app/bark-server.ts"]
    environment:
      BARK_TEST_PORT: "8080"
      BARK_TEST_LOG: /requests/requests.jsonl
    volumes:
      - ./bark-server.ts:/app/bark-server.ts:ro
      - bark-requests:/requests

  ssh-target:
    build:
      context: ./docker
      target: empty-runtime
      args:
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  ssh-target-legacy-node:
    build:
      context: ./docker
      target: legacy-node
      args:
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  ssh-target-npm-codex:
    build:
      context: ./docker
      target: npm-codex
      args:
        CODEX_CLI_VERSION: ${E2E_CODEX_CLI_VERSION:-0.140.0}
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  ssh-target-mfa:
    build:
      context: ./docker
      target: mfa-runtime
      args:
        CURRENT_CODEX_CLI_VERSION: ${E2E_SUPPORTED_CODEX_VERSION}
        # This stage's own `curl` (tests/e2e/docker/Dockerfile, current-codex-runtime) bakes a
        # Codex release straight into the image at build time, so it needs the same outbound
        # proxy as everything else when the sandbox has no direct internet route. `docker build`
        # does not read the invoking shell's http_proxy/https_proxy -- compose has to pass it
        # explicitly as a build arg, which is what this does.
        http_proxy: ${E2E_OUTBOUND_PROXY:-}
        https_proxy: ${E2E_OUTBOUND_PROXY:-}
        no_proxy: localhost,127.0.0.1
        E2E_UID: ${E2E_UID:-12345}
        E2E_GID: ${E2E_GID:-12345}
    <<: *ssh-target

  build-runner:
    image: codex-gateway-e2e-runner
    mem_limit: 4g
    build:
      context: ../..
      dockerfile: tests/e2e/runner.Dockerfile
    environment:
      # Keep enough cgroup headroom for Rolldown/Nitro native allocations while allowing the
      # JavaScript heap to finish the production bundle. The container is capped at 4 GiB.
      NODE_OPTIONS: --max-old-space-size=3072
      CODEX_GATEWAY_DB_PATH: /workspace/codex-gateway/.data-e2e/codex-gateway.db
      E2E_GATEWAY_USERNAME: ${E2E_GATEWAY_USERNAME:-e2e}
      E2E_GATEWAY_PASSWORD: ${E2E_GATEWAY_PASSWORD:-codex-gateway-e2e-password}
      E2E_GATEWAY_MEMBER_USERNAME: ${E2E_GATEWAY_MEMBER_USERNAME:-e2e-member}
      E2E_GATEWAY_MEMBER_PASSWORD: ${E2E_GATEWAY_MEMBER_PASSWORD:-codex-gateway-e2e-member-password}
    volumes:
      - build-output:/e2e-output
      - e2e-data:/workspace/codex-gateway/.data-e2e

  gateway-under-test:
    image: codex-gateway-e2e-runner
    mem_limit: 2g
    depends_on:
      - ssh-target
      - ssh-target-legacy-node
      - ssh-target-npm-codex
      - ssh-target-mfa
      - bark-target
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      CODEX_GATEWAY_CONFIG_SECRET: e2e-config-secret
      CODEX_GATEWAY_DB_PATH: /workspace/codex-gateway/.data-e2e/codex-gateway.db
      # The ~130MB Codex standalone archive is re-fetched for every provisioned container
      # otherwise. .data-e2e is wiped at the start of every run (see run-in-containers.sh), so the
      # cache gets its own named volume that survives `compose down` and is shared with
      # gateway-per-user -- both instances install the same version onto the same platform.
      CODEX_GATEWAY_CODEX_ARTIFACT_CACHE_DIR: /codex-artifact-cache
      NUXT_IGNORE_LOCK: "1"
      # Previews share the Gateway origin and are routed by cookie; BROWSER_PREVIEW_SCHEME only
      # keeps the HttpOnly cookie non-Secure over plain HTTP.
      BROWSER_PREVIEW_SCHEME: http
      CODEX_GATEWAY_PROVISIONING: docker
      CODEX_GATEWAY_USER_IMAGE: codex-gateway-e2e-user:latest
      CODEX_GATEWAY_DOCKER_NETWORK: ${E2E_COMPOSE_PROJECT_NAME:-codex-gateway-e2e}_default
      CODEX_GATEWAY_DOCKER_SOCKET: /var/run/docker.sock
      CODEX_GATEWAY_SHARED_AUTH_DIR: ${E2E_SHARED_AUTH_DIR:?E2E_SHARED_AUTH_DIR is required}
      CODEX_GATEWAY_SHARED_AUTH_MOUNT: /srv/codex-auth
      CODEX_GATEWAY_SHARED_DATA_DIR: ${E2E_SHARED_DATA_DIR:?E2E_SHARED_DATA_DIR is required}
      # /data/shared now defaults to read-only (see deploy/README.zh-CN.md's "安全加固"); this
      # fixture stays on "shared" isolation mode and multi-user-isolation.spec.ts explicitly
      # exercises the opt-in read-write sharing behavior across two members' containers, so it
      # needs to turn the opt-in flag back on.
      CODEX_GATEWAY_SHARED_DATA_WRITABLE: "true"
      CODEX_GATEWAY_USER_CONTAINER_PREFIX: codex-e2e-user-
      CODEX_GATEWAY_SANDBOX_MODE: danger-full-access
      # Outbound proxy for sandboxes with no direct internet route, using the real product config
      # item (see deploy/gateway-entrypoint.sh and CLAUDE.md's "出站代理" section) instead of a
      # test-only workaround. Empty by default -- behavior is unchanged. The extra no-proxy hosts
      # are the E2E fixture containers themselves, reached over the compose network rather than
      # through the sandbox's outbound proxy.
      CODEX_GATEWAY_OUTBOUND_PROXY: ${E2E_OUTBOUND_PROXY:-}
      CODEX_GATEWAY_OUTBOUND_NO_PROXY: ${E2E_OUTBOUND_PROXY:+ssh-target,ssh-target-legacy-node,ssh-target-npm-codex,ssh-target-mfa,bark-target}
      # Custom model provider path (E2E_MODEL_PROVIDER_API_KEY set by run-in-containers.sh).
      CODEX_GATEWAY_MODEL_PROVIDER: ${E2E_MODEL_PROVIDER:-openai}
      CODEX_GATEWAY_MODEL_PROVIDER_ID: ${E2E_MODEL_PROVIDER_ID:-ollama-cloud}
      CODEX_GATEWAY_MODEL_PROVIDER_BASE_URL: ${E2E_MODEL_PROVIDER_BASE_URL:-}
      CODEX_GATEWAY_MODEL_PROVIDER_API_KEY: ${E2E_MODEL_PROVIDER_API_KEY:-}
      CODEX_GATEWAY_MODEL: ${E2E_MODEL_PROVIDER_MODEL:-}
      CODEX_GATEWAY_WEB_SEARCH: ${E2E_MODEL_PROVIDER_WEB_SEARCH:-}
    volumes:
      - build-output:/e2e-output:ro
      - e2e-data:/workspace/codex-gateway/.data-e2e
      - codex-artifact-cache:/codex-artifact-cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ${E2E_SHARED_AUTH_DIR:?E2E_SHARED_AUTH_DIR is required}:/srv/codex-auth:ro
      - ../../deploy/user-container:/app/deploy/user-container:ro
    # Exercise the same V8 memory policy as production; the wider 2 GiB cgroup remains available
    # to Playwright's shared test topology and native browser/runtime allocations.
    command: ["node", "--expose-gc", "--max-old-space-size=512", "/e2e-output/server/index.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3100,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  # Fresh-instance gateway with its own empty data volume — used by setup.spec.ts for first-run
  # initialization coverage. No provider env needed; the test only exercises setup/login.
  gateway-fresh:
    image: codex-gateway-e2e-runner
    mem_limit: 1g
    environment:
      HOST: 0.0.0.0
      PORT: "3101"
      CODEX_GATEWAY_CONFIG_SECRET: e2e-config-secret
      CODEX_GATEWAY_DB_PATH: /data-fresh/codex-gateway.db
      BROWSER_PREVIEW_SCHEME: http
    volumes:
      - build-output:/e2e-output:ro
      - e2e-data-fresh:/data-fresh
    command: ["node", "/e2e-output/server/index.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3101,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  # Second provisioning-capable gateway, configured for CODEX_GATEWAY_USER_NETWORK_ISOLATION=
  # per-user (the default suite above stays on "shared" to match production's default and keep
  # the existing socat-based outbound-proxy fixture reachable). Own DB/volume so it never shares
  # state with gateway-under-test. Reuses the same built server output and user image; no outbound
  # proxy container is attached because network-isolation.spec.ts only asserts reachability
  # (codex --version over SSH needs no model API access), not a real turn.
  gateway-per-user:
    image: codex-gateway-e2e-runner
    mem_limit: 1g
    environment:
      HOST: 0.0.0.0
      PORT: "3102"
      CODEX_GATEWAY_CONFIG_SECRET: e2e-config-secret
      # Same volume/bind path build-runner wipes with `rm -rf .data-e2e/*` at the start of every
      # run-in-containers.sh invocation (see that script) -- a dedicated volume here would instead
      # accumulate users/containers across runs (and, worse, stale rows referencing containers
      # that a later run's cleanup trap already force-removed by label, which then spams the log
      # with harmless but confusing background-reconnect ENOTFOUND noise for old runs' users).
      CODEX_GATEWAY_DB_PATH: /workspace/codex-gateway/.data-e2e/codex-gateway-per-user.db
      CODEX_GATEWAY_CODEX_ARTIFACT_CACHE_DIR: /codex-artifact-cache
      BROWSER_PREVIEW_SCHEME: http
      CODEX_GATEWAY_PROVISIONING: docker
      CODEX_GATEWAY_USER_IMAGE: codex-gateway-e2e-user:latest
      CODEX_GATEWAY_DOCKER_SOCKET: /var/run/docker.sock
      CODEX_GATEWAY_SHARED_AUTH_DIR: ${E2E_SHARED_AUTH_DIR:?E2E_SHARED_AUTH_DIR is required}
      CODEX_GATEWAY_SHARED_AUTH_MOUNT: /srv/codex-auth
      CODEX_GATEWAY_USER_CONTAINER_PREFIX: codex-e2e-pu-
      CODEX_GATEWAY_SANDBOX_MODE: danger-full-access
      CODEX_GATEWAY_USER_NETWORK_ISOLATION: per-user
      # Dedicated test-only supernet, distinct from any subnet Docker itself auto-assigns, so the
      # isolation test's iptables setup (applied by run-in-containers.sh, torn down in its
      # cleanup trap) cannot collide with anything else on the runner host.
      CODEX_GATEWAY_USER_NETWORK_SUBNET_BASE: 10.250.0.0/16
      # This Gateway process's own Codex release-archive download (see CLAUDE.md's "出站代理")
      # needs the same sandbox proxy gateway-under-test uses -- without it every provision hits
      # `fetch failed` against releases.openai.com/GitHub, the standalone-layout migration never
      # completes, and the first real RPC connection to the user container fails. No NO_PROXY
      # entries: unlike gateway-under-test, this instance never talks to the ssh-target/bark-target
      # fixtures directly. Known, accepted limitation of this fixture only: the *same* proxy value
      # also gets injected into every user container it provisions (provisioningConfig().
      # outboundProxy has one value, shared by the Gateway process and its user containers), but
      # that address (the host's own bridge IP) is unreachable from inside an Internal per-user
      # network -- see deploy/README.zh-CN.md's "安全加固" (a real per-user deployment instead
      # points CODEX_GATEWAY_OUTBOUND_PROXY at a proxy *container* attached to every per-user
      # network via CODEX_GATEWAY_OUTBOUND_PROXY_CONTAINER, which this E2E topology has none of).
      # Harmless here: network-isolation.spec.ts only asserts reachability and RPC/SSH plumbing,
      # never a real model turn inside the isolated containers.
      CODEX_GATEWAY_OUTBOUND_PROXY: ${E2E_OUTBOUND_PROXY:-}
    volumes:
      - build-output:/e2e-output:ro
      - e2e-data:/workspace/codex-gateway/.data-e2e
      - codex-artifact-cache:/codex-artifact-cache
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "/e2e-output/server/index.mjs"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3102,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  test-runner:
    image: codex-gateway-e2e-runner
    mem_limit: 2g
    network_mode: service:gateway-under-test
    depends_on:
      gateway-under-test:
        condition: service_healthy
      gateway-fresh:
        condition: service_healthy
      gateway-per-user:
        condition: service_healthy
    environment:
      CI: ${CI:-}
      E2E_CONTAINERIZED: "1"
      E2E_DATABASE_PREPARED: "1"
      E2E_SOURCE_DIR: /workspace/source
      E2E_CODEX_HOME: /codex-auth
      E2E_REMOTE_HOST: ssh-target
      E2E_LEGACY_NODE_REMOTE_HOST: ssh-target-legacy-node
      E2E_NPM_CODEX_REMOTE_HOST: ssh-target-npm-codex
      E2E_MFA_REMOTE_HOST: ssh-target-mfa
      E2E_REMOTE_PORT: "22"
      E2E_REMOTE_USERNAME: codex
      E2E_REMOTE_PASSWORD: codex
      E2E_REMOTE_PROJECT_PATH: /workspace/codex-gateway
      E2E_CODEX_CLI_VERSION: ${E2E_CODEX_CLI_VERSION:-0.140.0}
      E2E_CODEX_MODEL: ${E2E_CODEX_MODEL:-gpt-5.6-luna}
      E2E_BARK_SERVER_URL: http://bark-target:8080
      E2E_BARK_REQUEST_LOG: /bark-requests/requests.jsonl
      E2E_GATEWAY_MEMBER_USERNAME: ${E2E_GATEWAY_MEMBER_USERNAME:-e2e-member}
      E2E_GATEWAY_MEMBER_PASSWORD: ${E2E_GATEWAY_MEMBER_PASSWORD:-codex-gateway-e2e-member-password}
      E2E_SHARED_AUTH_PRESENT: ${E2E_SHARED_AUTH_PRESENT:-0}
      E2E_MODEL_PROVIDER_API_KEY: ${E2E_MODEL_PROVIDER_API_KEY:-}
      E2E_MODEL_PROVIDER_ID: ${E2E_MODEL_PROVIDER_ID:-}
      E2E_MODEL_PROVIDER_BASE_URL: ${E2E_MODEL_PROVIDER_BASE_URL:-}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      HOME: /home/pwuser
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${E2E_CODEX_HOME:-${HOME}/.codex}:/codex-auth:ro
      - ../../test-results:/workspace/codex-gateway/test-results
      - e2e-data:/workspace/codex-gateway/.data-e2e
      - bark-requests:/bark-requests
      - runner-home:/home/pwuser
    working_dir: /workspace/codex-gateway

volumes:
  bark-requests:
  build-output:
  # Deliberately not wiped between runs -- see CODEX_GATEWAY_CODEX_ARTIFACT_CACHE_DIR above.
  codex-artifact-cache:
  e2e-data:
  e2e-data-fresh:
  runner-home:
