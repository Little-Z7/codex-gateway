x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "3"

services:
  codex-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-gateway
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "${CODEX_GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CODEX_GATEWAY_DB_PATH: /data/codex-gateway.db
      CODEX_GATEWAY_CONFIG_SECRET: ${CODEX_GATEWAY_CONFIG_SECRET:?CODEX_GATEWAY_CONFIG_SECRET is required}
      CODEX_GATEWAY_PROVISIONING: ${CODEX_GATEWAY_PROVISIONING:-docker}
      CODEX_GATEWAY_USER_IMAGE: ${CODEX_GATEWAY_USER_IMAGE:-codex-gateway-user:latest}
      CODEX_GATEWAY_DOCKER_NETWORK: ${CODEX_GATEWAY_DOCKER_NETWORK:-codex-gateway}
      CODEX_GATEWAY_DOCKER_SOCKET: ${CODEX_GATEWAY_DOCKER_SOCKET:-/var/run/docker.sock}
      CODEX_GATEWAY_SHARED_AUTH_DIR: ${CODEX_GATEWAY_SHARED_AUTH_DIR:?CODEX_GATEWAY_SHARED_AUTH_DIR is required}
      CODEX_GATEWAY_SHARED_AUTH_MOUNT: /srv/codex-auth
      CODEX_GATEWAY_SHARED_DATA_DIR: ${CODEX_GATEWAY_SHARED_DATA_DIR:-}
      CODEX_GATEWAY_USER_CONTAINER_PREFIX: ${CODEX_GATEWAY_USER_CONTAINER_PREFIX:-codex-user-}
      CODEX_GATEWAY_USER_CONTAINER_MEMORY: ${CODEX_GATEWAY_USER_CONTAINER_MEMORY:-}
      CODEX_GATEWAY_USER_CONTAINER_CPUS: ${CODEX_GATEWAY_USER_CONTAINER_CPUS:-}
      CODEX_GATEWAY_SANDBOX_MODE: ${CODEX_GATEWAY_SANDBOX_MODE:-danger-full-access}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEX_GATEWAY_SHARED_AUTH_DIR:?CODEX_GATEWAY_SHARED_AUTH_DIR is required}:/srv/codex-auth:ro
    # Keep liveness probes side-effect free. Nitro owns periodic GC so probe retries or Docker
    # daemon pauses cannot change application memory lifecycle.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - codex-gateway

  # Build-only service: produces the user workspace image. User containers themselves are
  # created by the Gateway provisioner at runtime, never by compose up.
  codex-gateway-user:
    image: ${CODEX_GATEWAY_USER_IMAGE:-codex-gateway-user:latest}
    build:
      context: ./deploy/user-container
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?CODEX_CLI_VERSION is required}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    profiles:
      - build-only

networks:
  codex-gateway:
    name: codex-gateway
